<!DOCTYPE html>
<html lang="en-us">
<head>
    <!-- COI Bootstrap: register service worker for COOP/COEP headers -->
    <!-- Enables SharedArrayBuffer (required for Vita3K's pthreads) on any static host -->
    <script>
    (function(){
        if (self.crossOriginIsolated) return;
        if (location.protocol === 'file:') {
            console.warn('[COI] file:// cannot use service workers. Serve via http:// for SharedArrayBuffer support.');
            return;
        }
        if (!('serviceWorker' in navigator)) {
            console.warn('[COI] Service workers not supported.');
            return;
        }
        var tried = false;
        try { tried = sessionStorage.getItem('coi-tried') === '1'; } catch(e) {}
        if (tried) {
            try { sessionStorage.removeItem('coi-tried'); } catch(e) {}
            console.warn('[COI] Isolation still unavailable after reload. coi-serviceworker.js may be missing.');
            return;
        }
        navigator.serviceWorker.register('./coi-serviceworker.js', {scope: './'}).then(function(r){
            console.log('[COI] SW registered, reloading to activate...');
            try { sessionStorage.setItem('coi-tried', '1'); } catch(e) {}
            setTimeout(function(){ location.reload(); }, 500);
        }).catch(function(e){
            console.error('[COI] SW registration failed:', e.message);
        });
    })();
    </script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0">
    <title>Vita3K</title>
    <style>
      html, body { padding: 0; margin: 0; overflow: hidden; height: 100%; background: #000; }
      #screen { width: 100%; height: 100%; display: block; }
      #qtspinner {
        position: fixed;
        inset: 0;
        z-index: 10;
        margin: 0;
        background: #000;
      }
      html { overscroll-behavior: none; }
      #screen canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        width: 100% !important;
        height: 100% !important;
        contain: strict;
        touch-action: none;
      }
    </style>
</head>
  <body onload="init()">
    <figure style="overflow: visible; display: block;" id="qtspinner">
      <center style="margin-top:1.5em; line-height:150%; color:#eee">
        <img src="qtlogo.svg" width="320" height="200" style="display:block">
        <strong>Vita3K for WebAssembly</strong>
        <div id="qtstatus">Loading persistent storage…</div>
        <noscript>JavaScript is disabled. Please enable JavaScript to use Vita3K.</noscript>
      </center>
    </figure>
    <div id="screen" style="display: block;"></div>

    <script type="text/javascript">
      window.Vita3KWebProfile = Object.freeze({
        internalResolution: 1.0,
        screenFilter: 'Bilinear',
        fxaa: false,
        bicubic: false,
        audio: 'Silent',
        initialMemoryMiB: 1536,
        moduleArguments: ['--log-level=6']
      });

      (() => {
        const nativeGetContext = HTMLCanvasElement.prototype.getContext;
        HTMLCanvasElement.prototype.getContext = function(type, attributes) {
          if (type === 'webgl2' || type === 'webgl') {
            attributes = {
              ...(attributes || {}),
              antialias: false,
              preserveDrawingBuffer: false,
              powerPreference: 'high-performance'
            };
          }
          return nativeGetContext.call(this, type, attributes);
        };
      })();

      const metricStartedAt = performance.now();
      window.Vita3KRuntimeMetrics = {
        startedAt: metricStartedAt,
        fps: 0,
        frameTimeMs: 0,
        rolling: { min: 0, average: 0, max: 0 },
        samples: [],
        wasmHeapBytes: window.Vita3KWebProfile.initialMemoryMiB * 1048576,
        longTasks: { count: 0, over250ms: 0, maxMs: 0, totalMs: 0 },
        milestones: { htmlInitializedMs: 0 },
        launchStages: [],
        gameActive: false,
        titleId: '',
        webgl: null
      };
      window.Vita3KRecordNativeMetrics = (fps, frameTimeMs, average, minimum, maximum, gameActive, titleId) => {
        const metrics = window.Vita3KRuntimeMetrics;
        const now = performance.now();
        metrics.fps = fps;
        metrics.frameTimeMs = frameTimeMs;
        metrics.rolling = { min: minimum, average, max: maximum };
        metrics.gameActive = !!gameActive;
        metrics.titleId = titleId || '';
        metrics.wasmHeapBytes = window.vita3kModule?.HEAPU8?.byteLength || 0;
        metrics.samples.push({ atMs: Math.round(now - metricStartedAt), fps, frameTimeMs, gameActive: !!gameActive });
        if (metrics.samples.length > 600)
          metrics.samples.splice(0, metrics.samples.length - 600);
        if (gameActive && metrics.milestones.gameActiveMs === undefined)
          metrics.milestones.gameActiveMs = Math.round(now - metricStartedAt);
        if (gameActive && fps > 0 && metrics.milestones.firstGameFrameMs === undefined)
          metrics.milestones.firstGameFrameMs = Math.round(now - metricStartedAt);
      };
      (() => {
        let windowStartedAt = performance.now();
        let frames = 0;
        window.Vita3KRecordPresentedFrame = () => {
          const metrics = window.Vita3KRuntimeMetrics;
          const now = performance.now();
          frames++;
          metrics.gameActive = true;
          if (metrics.milestones.gameActiveMs === undefined)
            metrics.milestones.gameActiveMs = Math.round(now - metricStartedAt);
          if (metrics.milestones.firstGameFrameMs === undefined)
            metrics.milestones.firstGameFrameMs = Math.round(now - metricStartedAt);
          const elapsed = now - windowStartedAt;
          if (elapsed < 1000)
            return;
          const fps = frames * 1000 / elapsed;
          const frameTimeMs = elapsed / frames;
          metrics.fps = fps;
          metrics.frameTimeMs = frameTimeMs;
          metrics.samples.push({ atMs: Math.round(now - metricStartedAt), fps, frameTimeMs, gameActive: true });
          if (metrics.samples.length > 600)
            metrics.samples.splice(0, metrics.samples.length - 600);
          const values = metrics.samples.slice(-60).map(sample => sample.fps);
          metrics.rolling = {
            min: Math.min(...values),
            average: values.reduce((sum, value) => sum + value, 0) / values.length,
            max: Math.max(...values)
          };
          frames = 0;
          windowStartedAt = now;
        };
      })();
      if ('PerformanceObserver' in window) {
        try {
          new PerformanceObserver(list => {
            const metrics = window.Vita3KRuntimeMetrics.longTasks;
            for (const entry of list.getEntries()) {
              metrics.count++;
              metrics.totalMs += entry.duration;
              metrics.maxMs = Math.max(metrics.maxMs, entry.duration);
              if (entry.duration >= 250) metrics.over250ms++;
            }
          }).observe({ type: 'longtask', buffered: true });
        } catch (_) {}
      }

      (() => {
        const nativeAddEventListener = EventTarget.prototype.addEventListener;
        EventTarget.prototype.addEventListener = function(type, listener, options) {
          if (type === 'wheel') {
            if (typeof options === 'boolean')
              options = { capture: options, passive: true };
            else
              options = { ...(options || {}), passive: true };
          }
          return nativeAddEventListener.call(this, type, listener, options);
        };
      })();

      window.Vita3KLoadDebug = (() => {
        const state = {
          pendingFetches: new Map(),
          lastNetworkFile: '(none)',
          lastFsFile: '(not mounted)',
          lastFsAt: 0,
          lastStage: 'HTML initialized',
          lastActivityAt: performance.now(),
          lastTickAt: performance.now(),
          readyAt: 0,
          heapBytes: window.Vita3KWebProfile.initialMemoryMiB * 1048576,
          stallReportedAt: 0
        };
        const touch = stage => {
          state.lastStage = stage;
          state.lastActivityAt = performance.now();
        };
        const fileName = value => {
          try {
            if (value instanceof Request) return new URL(value.url, location.href).pathname;
            return new URL(String(value), location.href).pathname;
          } catch (_) {
            return String(value);
          }
        };
        const snapshot = () => ({
          stage: state.lastStage,
          pendingFetches: Array.from(state.pendingFetches.keys()),
          lastNetworkFile: state.lastNetworkFile,
          lastFsFile: state.lastFsFile,
          lastFsAgeMs: state.lastFsAt ? Math.round(performance.now() - state.lastFsAt) : null,
          wasmHeapMiB: state.heapBytes ? Math.round(state.heapBytes / 1048576) : 0
        });

        const nativeFetch = window.fetch.bind(window);
        window.fetch = async (...args) => {
          const file = fileName(args[0]);
          state.pendingFetches.set(file, performance.now());
          touch('Fetching ' + file);
          try {
            const response = await nativeFetch(...args);
            state.pendingFetches.delete(file);
            state.lastNetworkFile = file;
            touch('Fetched ' + file + ' (' + response.status + ')');
            return response;
          } catch (error) {
            state.pendingFetches.delete(file);
            touch('Fetch failed: ' + file);
            throw error;
          }
        };

        return {
          noteFs(path) {
            state.lastFsFile = String(path);
            state.lastFsAt = performance.now();
          },
          noteStage(stage) {
            touch(String(stage));
          },
          markReady() {
            state.readyAt = performance.now();
            state.lastTickAt = state.readyAt;
            touch('Qt application loaded');
          },
          snapshot
        };
      })();

      function decodeWasmException(mod, ptr) {
        if (typeof ptr !== 'number' || !(ptr > 0)) return null;
        if (mod && typeof mod.getExceptionMessage === 'function') {
          try {
            var decoded = mod.getExceptionMessage(ptr);
            if (decoded) return String(decoded);
          } catch (e) {}
        }
        return null;
      }

      window.addEventListener('unhandledrejection', function(ev) {
        var r = ev && ev.reason;
        if (typeof r === 'number' && r > 0) {
          var decoded = decodeWasmException(window.vita3kModule, r);
          if (decoded) {
            console.error('[Vita3K] Decoded WASM exception:', decoded);
          }
        }
      });

      async function init() {
        const spinner = document.querySelector('#qtspinner');
        const screen = document.querySelector('#screen');
        const status = document.querySelector('#qtstatus');
        const showUi = ui => {
          screen.style.display = 'block';
          spinner.style.display = ui === spinner ? 'block' : 'none';
        };

        try {
          showUi(spinner);
          status.textContent = 'Loading persistent storage…';
          navigator.storage?.persist?.().catch(() => false);

          const hasSharedArrayBuffer = typeof SharedArrayBuffer !== 'undefined';
          console.log('SharedArrayBuffer available:', hasSharedArrayBuffer);
          if (!hasSharedArrayBuffer) {
            status.textContent = 'SharedArrayBuffer unavailable. Wait for the service worker to activate, then reload.';
          }

          const requestedTitle = new URLSearchParams(location.search).get('run-app');
          const moduleArguments = [
            ...window.Vita3KWebProfile.moduleArguments,
            ...(requestedTitle ? ['--installed-path', requestedTitle] : [])
          ];
          const instance = await qtLoad({
            arguments: moduleArguments,
            preRun: [module => {
              window.vita3kModule = module;
              window.Vita3KLoadDebug.noteStage('WASM preRun');

              if (!module.FS.__vita3kOpenTracked) {
                const nativeOpen = module.FS.open;
                module.FS.open = function(path, ...args) {
                  window.Vita3KLoadDebug.noteFs(path);
                  return nativeOpen.call(module.FS, path, ...args);
                };
                module.FS.__vita3kOpenTracked = true;
              }

              const root = '/libsdl/Vita3K/Vita3K';
              module.FS.mkdirTree(root);
              module.FS.mount(module.IDBFS, {}, root);
              module.addRunDependency('vita3k-idbfs');
              module.FS.syncfs(true, error => {
                if (error)
                  console.error('Vita3K persistent filesystem load failed:', error);
                else
                  console.log('Vita3K persistent filesystem loaded from IndexedDB');
                module.removeRunDependency('vita3k-idbfs');
              });
            }],
            qt: {
              preload: ['vita3k-preload.json'],
              onLoaded: () => {
                showUi(screen);
                window.Vita3KLoadDebug.markReady();
                const canvas = screen.querySelector('canvas') || window.vita3kModule?.canvas;
                if (canvas) {
                  canvas.setAttribute('aria-label', 'Vita3K game display');
                  canvas.style.width = '100%';
                  canvas.style.height = '100%';
                }
                requestAnimationFrame(() => requestAnimationFrame(() => {
                  window.dispatchEvent(new Event('resize'));
                }));
              },
              onExit: exitData => {
                status.textContent = 'Application exit' + (exitData.code !== undefined ? ' with code ' + exitData.code : '') + (exitData.text !== undefined ? ' (' + exitData.text + ')' : '');
                showUi(spinner);
              },
              entryFunction: window.vita3k_entry,
              containerElements: [screen]
            }
          });
          if (instance)
            window.vita3kModule = instance;
        } catch (error) {
          console.error(error);
          status.textContent = error.message;
        }
      }
    </script>
    <script src="Vita3K.js"></script>
    <script type="text/javascript" src="qtloader.js"></script>
</body>
</html>
